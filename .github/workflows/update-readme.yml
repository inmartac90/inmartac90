name: 🔄 Update README

on:
  push:
    paths:
      - 'profile.yaml'
      - 'scripts/generate_readme.py'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: pip install pyyaml
      
      - name: 🔨 Generate README
        run: python scripts/generate_readme.py
      
      - name: 📝 Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "🤖 README Bot"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generate README from profile.yaml [skip ci]" && git push)
